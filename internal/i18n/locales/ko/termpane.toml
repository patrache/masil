# Termpane area: the embedded pane (v0.1.3 A7.4–A7.7) — the ctrl+\ prefix
# keys, the status line while a pane has the keyboard, exit and quit questions.

[chat_unread]
desc = "표준 모드 상태줄 오른쪽: 도구 표면이 채팅을 가리고 있을 때 채팅의 안 읽은 메시지 수. n = 개수"
params = { n = "int" }
other = "💬 안 읽음 {n}"

[count_item]
desc = "목록 한 항목: 프로그램 이름과 실행 중인 개수. program = 프로그램 이름(번역하지 않음)"
params = { program = "string", n = "int" }
other = "{program} {n}개"

[downgraded]
desc = "토스트: 고른(또는 설정한) 여는 방식을 이 환경에서 못 써서 화면 전환(exec)으로 열었을 때. mode = 여는 방식 이름(tools.mode_pane·mode_window 문구)"
params = { mode = "string" }
other = "{mode|으로/로} 열 수 없어 화면 전환으로 열었어요"

[enter_hint]
desc = "상태줄 키 설명: 패널에서 나온 뒤 enter 로 다시 패널에 입력하기"
other = "패널에 입력"

[exec_return]
desc = "토스트: 화면 전환(exec)으로 띄운 프로그램에서 masil 로 돌아왔을 때, 그동안 온 남의 새 메시지·멘션 개수. program = 프로그램 이름(lazygit 등, 번역하지 않음)"
params = { program = "string", messages = "int", mentions = "int" }
other = "{program} 쓰는 동안 · 새 메시지 {messages} · 멘션 {mentions}"

[exit_confirm]
desc = "대화상자 본문: 패널 안 프로그램을 끝낼지 묻기(무엇을 하는지). program = 프로그램 이름(번역하지 않음)"
params = { program = "string" }
no_truncate = true
other = "{program} 프로그램을 끝낼까요? 저장하지 않은 내용은 사라질 수 있어요."

[exit_no]
desc = "대화상자 단추: 끝내지 않고 닫기"
other = "취소"

[exit_title]
desc = "대화상자 제목: 패널 안 프로그램 끝내기 확인"
other = "프로그램 끝내기"

[exit_yes]
desc = "대화상자 단추: 프로그램을 끝냄"
other = "끝내기"

[exited]
desc = "탭·테두리 제목 끝: 패널 안 프로그램이 스스로 끝났을 때. code = 종료 코드"
params = { code = "int" }
other = "끝남 · 종료 코드 {code}"

[help_close]
desc = "패널 도움말 창 바닥 줄"
other = "아무 키나 누르면 닫혀요"

[help_escape]
desc = "도움말 키 설명: 패널에서 쓰는 접두키(ctrl+\\) — 다음 키로 나가기·확대·끝내기 등"
other = "패널 접두키"

[help_focus]
desc = "패널 도움말: 접두키 다음 h/j/k/l·화살표 — 그 방향 창으로 포커스 이동"
other = "그 방향의 창으로"

[help_help]
desc = "패널 도움말: 접두키 다음 ? — 이 도움말"
other = "이 도움말"

[help_kill]
desc = "패널 도움말: 접두키 다음 x — 프로그램 끝내기(확인), 공유 중이면 공유부터 바로 끊기"
other = "프로그램 끝내기 · 공유 중이면 공유 먼저 끊기"

[help_leave]
desc = "패널 도움말: 접두키 다음 esc — 키보드를 masil 로 돌려줌, 프로그램은 계속 돎"
other = "패널에서 나가기 (프로그램은 계속 돎)"

[help_literal]
desc = "패널 도움말: 접두키를 두 번 — 접두키 자체를 프로그램에 보냄"
other = "접두키 자체를 프로그램에 보내기"

[help_palette]
desc = "패널 도움말: 접두키 다음 p — 명령 팔레트"
other = "명령 팔레트"

[help_scroll]
desc = "패널 도움말: 접두키 다음 [ — 지난 줄 보기(휠·pgup/pgdn, esc 끝)"
other = "보기 스크롤 (휠·pgup/pgdn, esc 끝)"

[help_surface]
desc = "패널 도움말: 접두키 다음 t — 도구 표면과 채팅 오가기"
other = "도구 ↔ 채팅"

[help_title]
desc = "패널 도움말 창 제목"
other = "패널 키"

[help_tools_leave]
desc = "패널 도움말: ctrl+t(접두키 없이) — 패널에서 나와 채팅으로, 프로그램은 계속 돎"
other = "채팅으로 나가기 (프로그램은 계속 돎)"

[help_zoom]
desc = "패널 도움말: 접두키 다음 z — 확대(넓게 보기)"
other = "확대"

[input_hint]
desc = "상태줄: 패널이 키보드를 쥐고 있을 때 늘 보임. program = 프로그램 이름(번역하지 않음), key = 접두키(ctrl+\\ 등, 키맵에서)"
params = { program = "string", key = "string" }
other = "⌨ {program} 에 입력 중 · {key} esc 나가기"

[input_hint_tools]
desc = "상태줄: 패널이 키보드를 쥐고 있을 때 늘 보임(도구가 켜져 있을 때). program = 프로그램 이름(번역하지 않음), key = 패널에서 나와 채팅으로 가는 키(ctrl+t 등, 키맵에서)"
params = { program = "string", key = "string" }
other = "⌨ {program} 에 입력 중 · {key} 나가기"

[kbd_limits]
desc = "패널 도움말·안내 한 줄(A7.6): 패널 안에서는 확장 키가 안 감, Claude Code 줄바꿈 대신 ctrl+j"
other = "패널 안에서는 shift+enter 같은 확장 키가 가지 않아요 · Claude Code 줄바꿈은 ctrl+j"

[kbd_nvim]
desc = "패널 도움말·안내 한 줄(A7.5): nvim 터미널 모드 나가기 키를 패널에서 누르는 법. key = 접두키(ctrl+\\ 등)"
params = { key = "string" }
other = "nvim 터미널 모드의 {key} ctrl+n 은 {key} {key} ctrl+n 으로 눌러요"

[nested_warning]
desc = "시작 토스트: masil 패널 안(MASIL_PANE=1)에서 masil 을 또 켰을 때. 막지는 않음"
other = "패널 안에서 masil 을 켰어요 · 키가 겹칠 수 있어요"

[pane_limit]
desc = "토스트: 살아 있는 패널이 상한(모든 도구 합계)이라 새 패널을 못 열 때. max = 상한"
params = { max = "int" }
other = "패널은 동시에 {max}개까지예요 · 하나를 닫거나 화면 전환으로 여세요"

[prefix_hint]
desc = "상태줄: 접두키를 누른 뒤 2초 동안 다음 키를 기다릴 때. key = 접두키(ctrl+\\ 등)"
params = { key = "string" }
other = "{key} 다음: esc 나가기 · z 확대 · x 끝내기 · p 팔레트 · ? 도움말"

[quit_confirm]
desc = "대화상자 본문(무엇을 하는지): masil 을 끌 때 살아 있는 패널 프로그램 목록과 함께 끌지 묻기. list = count_item 을 \", \" 로 이은 것(예: lazygit 1개, nvim 1개)"
params = { list = "string" }
no_truncate = true
other = "{list}가 실행 중이에요. 함께 끌까요?"

[quit_no]
desc = "대화상자 단추(기본 선택): 끄지 않고 돌아가기"
other = "아니오"

[quit_title]
desc = "대화상자 제목: masil 을 끌 때 패널 프로그램이 아직 돌고 있음"
other = "masil 끄기"

[quit_yes]
desc = "대화상자 단추: 패널 프로그램을 끝내고 masil 도 끔"
other = "함께 끄기"

[scroll_hint]
desc = "상태줄: 패널의 보기 스크롤(지난 줄 보기) 중"
other = "보기 스크롤 · 휠·pgup/pgdn 이동 · esc 끝"

[shared_badge]
desc = "패널 테두리 제목 끝(초소형은 패널 첫 줄)에 붙는 표시: 이 패널 화면을 다른 사람에게 공유하는 중. 자르지 않는다(제목이 먼저 잘림)"
max = 9
no_truncate = true
other = "● 공유 중"
