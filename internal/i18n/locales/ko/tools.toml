# Tools area: the tool surface, hub and tool entry points (v0.1.3 spec A8).

# Tool secrets (v0.1.3 spec A9): where a value is kept, the consent and masked
# prompt dialogs, the settings "도구 로그인" section and the logout option.
[backend_credman]
desc = "비밀값 보관 위치: Windows 자격 증명 관리자(설정 도구 로그인 줄·API 환경 화면)"
other = "자격 증명 관리자"

[backend_file]
desc = "비밀값 보관 위치: 0600 일반 파일 — 같은 PC 에 접근할 수 있는 사람은 볼 수 있다는 경고(줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "일반 파일(권한 600) — 이 PC 에 접근할 수 있는 사람은 볼 수 있어요"

[backend_keychain]
desc = "비밀값 보관 위치: macOS 키체인"
other = "키체인"

[backend_memory]
desc = "비밀값 보관 위치: 이번 실행 동안만 메모리에(끝내면 사라짐)"
other = "이번 실행만"

[backend_secret_service]
desc = "비밀값 보관 위치: Linux Secret Service(제품 이름, 번역하지 않음)"
other = "Secret Service"

[consent_file]
desc = "키체인을 쓸 수 없을 때의 동의 대화상자 선택지 ①"
other = "① 파일에 저장"

[consent_footer]
desc = "동의 대화상자 바닥 줄 키 안내"
other = "1·2 고르기 · enter 확인 · esc 취소"

[consent_question]
desc = "키체인을 쓸 수 없을 때 저장 직전에 묻는 문장(두 선택지 설명 포함, 줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "키체인을 쓸 수 없어요. ① 파일에 저장(이 PC 의 내 계정만 읽을 수 있어요) ② 이번 실행 동안만 기억"

[consent_session]
desc = "키체인을 쓸 수 없을 때의 동의 대화상자 선택지 ②(기본)"
other = "② 이번 실행 동안만 기억"

[help_group]
desc = "도움말 화면의 묶음 머리: 도구 표면 키"
other = "도구"

[hub_close]
desc = "허브 첫 줄 오른쪽 끝: 도구 표면을 닫는 키(ctrl+t 등, 키맵에서)"
params = { key = "string" }
other = "{key} 닫기"

[hub_empty]
desc = "허브에 켜진 도구가 하나도 없을 때"
other = "아직 쓸 수 있는 도구가 없어요"

[hub_footer]
desc = "허브 바닥 줄 키 안내(range = 숫자 범위, 예: 1–5)"
params = { range = "string" }
other = "enter 열기 · m 여는 방식 고르기 · x 닫기 · {range} 바로"

[hub_open_header]
desc = "허브의 열린 도구 인스턴스 목록 머리(앞뒤에 ── 가 붙음)"
other = "열려 있음"

[key_toggle]
desc = "도움말 키 설명: ctrl+t — 도구 표면과 채팅 사이 오가기"
other = "도구 ↔ 채팅"

[key_zoom]
desc = "도움말 키 설명: ctrl+w z — 활성 도구의 넓게 보기 켜고 끄기"
other = "도구 넓게 보기"

[limit_toast]
desc = "도구 표면에 더 열 수 없을 때의 토스트(허브 포함 개수)"
params = { max = "int" }
other = "도구는 {max}개까지 열 수 있어요 · 허브에서 하나를 닫아 주세요"

[logins_forget]
desc = "설정 도구 로그인 줄 끝의 지우기 단추"
other = "[지우기]"

[logins_forget_body]
desc = "도구 로그인 지우기 확인 대화상자 본문(무엇을 하는지, 줄여 쓰지 않음)"
no_truncate = true
other = "이 기기에 저장한 로그인 정보를 지워요. 다시 쓰려면 다시 로그인해야 해요."

[logins_forget_failed]
desc = "도구 로그인 지우기가 실패했을 때 줄 아래 오류"
other = "지우지 못했어요"

[logins_forget_no]
desc = "도구 로그인 지우기 확인 대화상자의 취소 단추"
other = "취소"

[logins_forget_title]
desc = "도구 로그인 지우기 확인 대화상자 제목(tool = 도구 이름)"
params = { tool = "string" }
other = "{tool} 로그인을 지울까요?"

[logins_forget_yes]
desc = "도구 로그인 지우기 확인 대화상자의 지우기 단추"
other = "지우기"

[logins_section]
desc = "설정 화면 묶음 이름: 도구마다 저장한 로그인과 보관 위치"
other = "도구 로그인"

[logout_wipe]
desc = "로그아웃 대화상자의 선택지(기본 꺼짐): 이 기기의 도구 비밀값도 함께 지움"
no_truncate = true
other = "이 기기의 도구 로그인도 지우기"

[logout_wipe_failed]
desc = "로그아웃할 때 '이 기기의 도구 로그인도 지우기'를 골랐는데 저장소가 지우지 못했을 때의 오류 토스트"
no_truncate = true
other = "이 기기의 도구 로그인을 지우지 못했어요"

[menu_footer]
desc = "여는 방식 메뉴의 바닥 줄 키 안내"
other = "enter 고르기 · esc 취소"

[menu_title]
desc = "허브의 여는 방식 메뉴 머리(tool = 아이콘과 도구 이름, 앞뒤에 ── 가 붙음)"
params = { tool = "string" }
other = "여는 방식 · {tool}"

[mode_auto]
desc = "여는 방식 메뉴: 알아서 고르기(설정·환경에 따라)"
other = "자동"

[mode_exec]
desc = "여는 방식 메뉴: 터미널을 그 프로그램에 넘겨줌(끝나면 돌아옴)"
other = "화면 전환"

[mode_pane]
desc = "여는 방식 메뉴: masil 안 패널에서"
other = "패널"

[mode_window]
desc = "여는 방식 메뉴: tmux 팝업 창"
other = "외부 창"

[palette_hub]
desc = "명령 팔레트: 도구 허브 열기"
other = "도구 허브"

[palette_next]
desc = "명령 팔레트: 열린 다음 도구로"
other = "다음 도구"

[palette_prev]
desc = "명령 팔레트: 열린 이전 도구로"
other = "이전 도구"

[palette_toggle]
desc = "명령 팔레트: 도구 표면과 채팅 사이 오가기"
other = "도구 ↔ 채팅"

[palette_zoom]
desc = "명령 팔레트: 활성 도구의 넓게 보기 켜고 끄기"
other = "도구 넓게 보기"

[prompt_footer]
desc = "비밀값 입력 대화상자 바닥 줄 키 안내(값은 가림표로만 보임)"
other = "enter 저장 · esc 취소"

[slash_desc]
desc = "입력창 /tools 자동 완성·도움말 설명"
other = "도구 허브를 열어요"

[tab_label]
desc = "컴팩트·위젯 탭 줄의 도구 표면 칸(초소형은 짧은 형)"
max = 6
other = "도구"
short = "도"
