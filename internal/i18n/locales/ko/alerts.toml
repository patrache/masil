# Alert templates (docs/contract/i18n/alert-templates.json). Key = template id
# with "." as "_" plus _title (and _body for body "template"). The ko text must
# stay byte-equal to the server's ko fallback (server/src/lib/i18n.ts) so the
# TUI and the daemon show what 0.1.2 showed.

[doc_comment_mention_title]
desc = "알림 제목: 방 문서 댓글에서 나를 멘션함. actor = 보낸 사람 이름, doc = 문서 제목, space = 방 이름(ko 는 쓰지 않음)"
params = { actor = "string", doc = "string", space = "string" }
other = "{actor}님이 {doc} 댓글에서 멘션했어요"

[focus_summary_body]
desc = "알림 본문: 집중 모드가 끝났을 때 놓친 알림 종류별 개수"
params = { thread_reply = "int", invite = "int", friend_request = "int", other = "int" }
other = "스레드 답글 {thread_reply} · 초대 {invite} · 친구 요청 {friend_request} · 기타 {other}"

[focus_summary_title]
desc = "알림 제목: 집중 모드가 끝남, 놓친 멘션·DM 개수"
params = { mention = "int", dm = "int" }
other = "집중 모드 끝 — 멘션 {mention}, DM {dm}"

[invite_space_title]
desc = "알림 제목: 방 초대를 받음. actor = 초대한 사람, space = 방 이름"
params = { actor = "string", space = "string" }
other = "{actor}님이 {space} 방에 초대했어요"

[message_channel_title]
desc = "알림 제목: 채널 새 메시지. actor = 보낸 사람, space = 방 이름, channel = 채널 이름(# 뒤)"
params = { actor = "string", space = "string", channel = "string" }
other = "{actor} · {space} #{channel}"

[message_dm_title]
desc = "알림 제목: DM 새 메시지. 보낸 사람 이름만"
params = { actor = "string" }
other = "{actor}"

[message_group_title]
desc = "알림 제목: 그룹 DM 새 메시지. actor = 보낸 사람, group = 그룹 이름"
params = { actor = "string", group = "string" }
other = "{actor} · {group}"

[post_like_title]
desc = "알림 제목: 내 글에 좋아요. actor = 누른 사람"
params = { actor = "string" }
other = "{actor}님이 글을 좋아해요"

[post_mention_title]
