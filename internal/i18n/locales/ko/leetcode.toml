# Leetcode area: the LeetCode daily problem tool (v0.1.3 spec A10) and the
# operator command that fixes a day's stored facts.

[admin_daily_set]
desc = "운영자 CLI 출력: masil admin leet-daily set 이 그날 사실 정보를 고치고 #daily 루트 카드를 새로 썼을 때. date = UTC 날짜 YYYY-MM-DD, slug = 문제 slug(번역하지 않음)"
params = { date = "string", slug = "string" }
other = "{date} 오늘의 문제를 {slug} 로 고쳤습니다."

[admin_usage]
desc = "운영자 CLI 사용법 한 줄: masil admin leet-daily set. 명령·플래그 이름·Easy/Medium/Hard 는 번역하지 않는다"
no_truncate = true
other = "사용법: masil admin leet-daily set <YYYY-MM-DD> --id <번호> --slug <slug> --title <제목> --difficulty Easy|Medium|Hard [--tags a,b] [--paid]"

[auto_status_desc]
desc = "설정 줄 설명: 상태 메시지 자동 표시를 켜면 친구에게 지금 문제를 푸는 중이 보인다는 개인정보 안내(A10.5 — 줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "켜면 친구에게 지금 문제를 푸는 중이 보여요"

[cmd_board]
desc = "명령 팔레트 항목: 지금 방의 오늘의 문제 순위 보기"
other = "오늘의 문제 순위"

[cmd_daily_toggle]
desc = "명령 팔레트 항목: 지금 방의 #daily 채널(오늘의 문제 스레드) 켜기·끄기 — 방 owner·admin 만. #daily 는 채널 이름(번역하지 않음)"
other = "이 방의 #daily 켜기·끄기"

[cmd_open]
desc = "명령 팔레트 항목: 오늘의 문제 도구 열기"
other = "오늘의 문제 열기"

[cmd_settings]
desc = "명령 팔레트 항목: 오늘의 문제 설정(언어·풀이 폴더·상태 메시지·#daily)"
other = "오늘의 문제 설정"

[daily_disabled]
desc = "토스트: 방의 #daily 를 껐을 때. space = 방 이름"
params = { space = "string" }
other = "{space} 의 #daily 를 껐어요"

[daily_enabled]
desc = "토스트: 방에 #daily 를 켰을 때. space = 방 이름(사용자 이름, 번역하지 않음)"
params = { space = "string" }
other = "{space} 에 #daily 를 켰어요"

[first_run_dir]
desc = "첫 실행 안내: 풀이 파일이 저장될 폴더. dir = 폴더 경로(번역하지 않음)"
params = { dir = "string" }
other = "풀이 폴더 {dir}"

[first_run_footer]
desc = "첫 실행 안내 바닥 줄 키 안내(↑↓·enter 는 키 이름)"
max = 36
other = "↑↓ 언어 · enter 시작"

[first_run_lang]
desc = "첫 실행 안내: 풀 언어 고르기 목록의 머리(아래에 Go·Python3 … 언어 이름 목록)"
max = 30
other = "풀 언어"

[first_run_notice]
desc = "첫 실행 안내: 문제를 사용자 PC 가 LeetCode 에서 직접 받는다는 것과 masil 이 LeetCode 와 관계없는 앱이라는 고지(약관 메모 A10.6 — 줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "LeetCode 문제를 이 PC 가 직접 받아 와요. masil 은 LeetCode 와 관계없는 앱이에요."

[first_run_title]
desc = "첫 실행 안내 대화상자 제목(테두리)"
max = 24
other = "오늘의 문제 시작"

[hub_not_loaded]
desc = "도구 허브 오늘의 문제 줄의 상태: 오늘 문제를 아직 받지 않았을 때(허브는 LeetCode 에 묻지 않는다)"
max = 40
other = "오늘 문제를 아직 안 받았어요"

[hub_status]
desc = "도구 허브 오늘의 문제 줄의 상태. id = 문제 번호, difficulty = Easy/Medium/Hard(번역하지 않음), solved = unsolved·solved 문구, streak = 연속 풀이 일수"
params = { id = "string", difficulty = "string", solved = "string", streak = "int" }
other = "{id} · {difficulty} · {solved} · 🔥 {streak}일"

[hub_status_short]
desc = "도구 허브 오늘의 문제 줄의 상태: 문제는 알지만 연속 풀이를 아직 모를 때(서버에 묻기 전). id = 문제 번호, difficulty = Easy/Medium/Hard"
params = { id = "string", difficulty = "string" }
other = "{id} · {difficulty}"

# The tool entry (v0.1.3 A10.4): hub row, palette, first run, settings.
[name]
desc = "도구 이름(허브·탭·팔레트·설정 도구 로그인 줄): LeetCode 오늘의 문제 도구"
max = 12
other = "오늘의 문제"

[off]
desc = "설정 값: 꺼짐"
max = 6
other = "끔"

[on]
desc = "설정 값: 켜짐"
max = 6
other = "켬"

[prefix_run]
desc = "ctrl+\\ 접두키 도움말: r = 지금 풀이 파일을 LeetCode 에서 실행"
max = 16
other = "실행"

[prefix_submit]
desc = "ctrl+\\ 접두키 도움말: s = 지금 풀이 파일을 LeetCode 에 제출"
max = 16
other = "제출"

[save_failed]
desc = "토스트: config.toml 에 설정을 저장하지 못했을 때(이번 실행에는 바뀐 값이 쓰임)"
other = "설정을 저장하지 못했어요"

[settings_auto_status]
desc = "설정 줄 이름: 문제를 여는 동안 상태 메시지에 '1606 푸는 중' 을 자동으로 보이기"
max = 30
other = "상태 메시지 자동 표시"

[settings_daily]
desc = "설정 줄 이름: 내가 owner·admin 인 방의 #daily 채널 켜기·끄기. space = 방 이름. #daily 는 채널 이름(번역하지 않음)"
params = { space = "string" }
other = "#daily · {space}"

[settings_dir]
desc = "설정 줄 이름: 풀이 파일 폴더(값은 경로)"
max = 20
other = "풀이 폴더"

[settings_dir_footer]
desc = "오늘의 문제 설정: 풀이 폴더 입력 중 바닥 줄 키 안내(빈 칸 = 기본 폴더)"
max = 40
other = "enter 저장 · esc 취소"

[settings_footer]
desc = "오늘의 문제 설정 대화상자 바닥 줄 키 안내(↑↓·enter·esc 는 키 이름)"
max = 40
other = "↑↓ 이동 · enter 바꾸기 · esc 닫기"

[settings_lang]
desc = "설정 줄 이름: 풀 언어(값은 Go·Python3 같은 언어 이름)"
max = 20
other = "언어"

[settings_share_friends]
desc = "설정 줄 이름: 친구 순위에 내 연속 풀이 일수를 보이기(서버 설정 leet_share_with_friends)"
max = 30
other = "친구에게 연속 풀이 보이기"

[settings_title]
desc = "오늘의 문제 설정 대화상자 제목(테두리)"
max = 24
other = "오늘의 문제 설정"

[solved]
desc = "허브·초소형 줄: 오늘 문제를 풀었음(통과)"
max = 12
other = "풂"

[unsolved]
desc = "허브·초소형 줄: 오늘 문제를 아직 안 풀었음"
max = 12
other = "아직 안 풂"
