# Time area: dates, times, counts and durations (humanize, i18n 6.7).
# Time zone and 12/24h come from settings, never from the language. The
# number thresholds (when a count is abbreviated) are in internal/humanize.

[am]
desc = "12시간 시계의 오전 표시(Clock)"
other = "오전"

[clock_12h]
desc = "12시간 시계. ampm = am/pm 문구, time = \"11:05\" 같은 시:분(숫자)"
params = { ampm = "string", time = "string" }
other = "{ampm} {time}"

[count_tier1]
desc = "큰 수 줄임 첫 단계. n = 줄인 수(\"1.2\" 같은 문자열). 기준 수는 코드에 있음: ko 1,000(천), en 1,000(K), zh-Hans 10,000(万)"
params = { n = "string" }
other = "{n}천"

[count_tier2]
desc = "큰 수 줄임 둘째 단계. 기준: ko 10,000(만), en 1,000,000(M), zh-Hans 100,000,000(亿)"
params = { n = "string" }
other = "{n}만"

[count_tier3]
desc = "큰 수 줄임 셋째 단계. 기준: ko 100,000,000(억), en 1,000,000,000(B), zh-Hans 1,000,000,000,000(万亿)"
params = { n = "string" }
other = "{n}억"

[day_divider]
desc = "채팅의 날짜 구분선. year = 연도, month = month_long_N 문구, day = 일(숫자), weekday = weekday_N 문구"
params = { year = "string", month = "string", day = "string", weekday = "string" }
other = "{year}년 {month}월 {day}일 {weekday}"

[duration_hours]
desc = "걸린 시간: 시간(분이 0)"
params = { n = "int" }
other = "{n}시간"

[duration_hours_minutes]
desc = "걸린 시간: 시간과 분. h = 시간, m = 분"
params = { h = "int", m = "int" }
other = "{h}시간 {m}분"

[duration_minutes]
desc = "걸린 시간: 분"
params = { n = "int" }
other = "{n}분"

[duration_seconds]
desc = "걸린 시간: 1분 안의 초"
params = { n = "int" }
other = "{n}초"

[full_date]
desc = "지난해 이전 날짜(메시지 시각·상대 시각). year = 연도, month = month_short_N 문구, day = 일(숫자)"
params = { year = "string", month = "string", day = "string" }
other = "{year}. {month}. {day}."

[month_day]
desc = "올해 날짜(메시지 시각·상대 시각). month = month_short_N 문구, day = 일(숫자)"
params = { month = "string", day = "string" }
other = "{month}월 {day}일"

[month_day_at]
desc = "올해 날짜와 시각(메시지 시각). date = month_day 결과, clock = 시각"
params = { date = "string", clock = "string" }
other = "{date} {clock}"

