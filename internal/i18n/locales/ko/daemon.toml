other = "아직 로그인하지 않았습니다 — 'masil login' 뒤부터 알림이 옵니다."

[install_shell_server]
desc = "masil daemon install 경고: 셸의 MASIL_SERVER 는 자동 시작된 데몬에 전달되지 않음. shell = 셸의 값, server = 데몬이 쓰는 주소"
params = { shell = "string", server = "string" }
no_truncate = true
other = "⚠ 셸의 MASIL_SERVER({shell})는 자동 시작된 데몬에 전달되지 않습니다 — 데몬은 {server} 에 접속합니다. config.toml 의 server 를 같은 주소로 맞추세요."

[installed]
