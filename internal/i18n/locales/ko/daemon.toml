desc = "자동 시작 오류: 실행 파일 경로가 절대 경로가 아님. exe = 경로"
params = { exe = "string" }
no_truncate = true
other = "자동 시작에 등록할 실행 파일 경로가 절대 경로가 아닙니다: {exe}"

[exe_not_regular]
