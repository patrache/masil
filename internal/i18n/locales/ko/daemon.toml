# Daemon area: `masil daemon …` messages, `masil daemon status` and the
# autostart errors (cmd/masil/cmd_daemon.go, internal/autostart).

[already_running]
desc = "masil daemon run 결과: 이미 실행 중"
no_truncate = true
other = "데몬이 이미 실행 중입니다."

[autostart_check_failed]
desc = "status 자동 시작 값: 확인하지 못함. err = 오류 설명"
params = { err = "string" }
no_truncate = true
other = "확인 실패 — {err}"

[autostart_installed]
desc = "status 자동 시작 값: 등록됨. detail = 등록 위치"
params = { detail = "string" }
no_truncate = true
other = "등록됨 · {detail}"

[autostart_not_installed]
desc = "status 자동 시작 값: 등록 안 됨(명령은 번역하지 않음)"
no_truncate = true
other = "등록 안 됨 — masil daemon install"

[autostart_unsupported]
desc = "status 자동 시작 값: 이 OS 는 지원하지 않음"
no_truncate = true
other = "이 OS 는 지원하지 않음"

[detach_failed]
desc = "masil daemon run 오류: 백그라운드로 못 띄움. err = 오류 설명"
params = { err = "string" }
no_truncate = true
other = "데몬을 백그라운드로 띄우지 못했습니다: {err}"

[detached]
desc = "masil daemon run 결과: 백그라운드에서 시작함. log = 로그 파일 경로"
params = { log = "string" }
no_truncate = true
other = "백그라운드에서 데몬을 시작했습니다 (로그: {log})"

[detail_exe_missing]
desc = "등록 위치 뒤: 등록된 실행 파일이 없어짐. detail = 등록 위치, exe = 등록된 실행 파일 경로"
params = { detail = "string", exe = "string" }
no_truncate = true
other = "{detail} · 실행 파일 없음: {exe}"

