# Workspace area: the workspace tool (v0.1.3 spec B) — the solo surface, the
# owner's share screens and dialogs, the participant screens.

[band_private]
desc = "상단 띠(혼자 쓰기): 아무에게도 안 보이는 상태와 폴더 이름. folder = 폴더 이름(번역하지 않음)"
params = { folder = "string" }
other = "🔒 나만 보기 · {folder}"

[code_cannot_open]
desc = "코드 칸: 열 수 없는 파일(차단·무시·찾을 수 없음 등)을 골랐을 때"
other = "이 파일은 열 수 없어요"

[code_cannot_open_binary]
desc = "코드 칸: 바이너리 파일(앞 8 KiB 에 NUL 이 있거나 UTF-8 이 아님)이라 열지 않음"
other = "바이너리 파일은 열지 않아요"

[code_cannot_open_large]
desc = "코드 칸: 2 MiB 넘는 파일이라 열지 않음"
other = "2 MiB 넘는 파일은 열지 않아요"

[code_deleted_on_disk]
desc = "코드 칸 머리: 열어 둔 파일이 디스크에서 지워짐(저장하면 다시 만들어짐)"
other = "디스크에서 지워짐"

[code_empty_hint]
desc = "코드 칸: 아직 연 파일이 없을 때 안내"
other = "트리에서 파일을 골라 enter"

[code_readonly_large]
desc = "코드 칸 머리: 512 KiB 넘는 파일이라 읽기 전용으로 열림"
other = "읽기 전용 · 512 KiB 넘는 파일"

[code_readonly_mixed_eol]
desc = "코드 칸 머리: 줄 끝(LF·CRLF)이 섞인 파일이라 읽기 전용으로 열림"
other = "읽기 전용 · 줄 끝이 섞인 파일"

[code_unsaved]
desc = "코드 칸 머리: 디스크에 저장하지 않은 편집이 있음"
other = "● 저장 안 됨"

[disk_merged]
desc = "코드 칸 알림: 다른 프로그램이 파일을 바꿔서 저장 안 된 편집과 합쳤을 때(무엇을 할 수 있는지)"
no_truncate = true
other = "디스크에서 바뀐 내용을 합쳤어요 · u 되돌리기 · d 디스크 버전으로"

[dlg_hint]
desc = "작업공간 대화상자 바닥 줄 키 안내"
other = "↑↓ 고르기 · enter 확인 · esc 닫기"

[hub_name]
desc = "도구 허브·탭·팔레트에 보이는 도구 이름"
other = "작업공간"

[hub_status_idle]
desc = "도구 허브 상태: 열린 폴더가 없을 때. n = 초대받은 공유 수"
params = { n = "int" }
other = "폴더 열기 · 초대 {n}"

[hub_status_private]
desc = "도구 허브 상태: 혼자 쓰는 중. folder = 폴더 이름(번역하지 않음), n = 터미널 수"
params = { folder = "string", n = "int" }
other = "{folder} · 🔒 나만 보기 · 터미널 {n}"

[hub_status_sharing]
desc = "도구 허브 상태: 공유 중. folder = 폴더 이름, n = 들어온 사람 수"
params = { folder = "string", n = "int" }
other = "{folder} · 🔴 공유 중 {n}명"

[newterm_custom]
desc = "새 터미널 목록의 마지막 줄: 실행할 명령을 직접 입력"
other = "명령 직접 입력"

[newterm_title]
desc = "새 터미널 대화상자 제목"
other = "새 터미널"

[open_failed]
desc = "토스트: 고른 폴더를 열지 못했을 때"
other = "폴더를 열 수 없어요"

[path_prompt]
desc = "폴더 고르기 화면: 경로를 직접 입력하는 칸의 이름"
other = "경로 입력"

[pick_folder_title]
desc = "폴더 고르기 화면 제목"
other = "폴더 열기"

[prefix_help_code]
desc = "패널 도움말: 접두키 다음 2 — 코드 칸으로"
other = "코드 칸으로"

[prefix_help_exec]
desc = "패널 도움말: 접두키 다음 e — 터미널 프로그램을 전체 화면(화면 전환)으로 실행"
other = "전체 화면으로 실행"

[prefix_help_follow]
desc = "패널 도움말: 접두키 다음 f — 남의 터미널 화면에서 커서 따라가기 다시 켜기"
other = "커서 따라가기"

[prefix_help_new_term]
desc = "패널 도움말: 접두키 다음 n — 새 터미널"
other = "새 터미널"

[prefix_help_people]
desc = "패널 도움말: 접두키 다음 4 — 사람 목록으로"
other = "사람 목록으로"

[prefix_help_share]
desc = "패널 도움말: 접두키 다음 S — 공유 시작"
other = "공유 시작"

[prefix_help_term]
desc = "패널 도움말: 접두키 다음 3 — 터미널 칸으로"
other = "터미널 칸으로"

[prefix_help_tree]
desc = "패널 도움말: 접두키 다음 1 — 트리 칸으로"
other = "트리 칸으로"

[recent_folders]
desc = "폴더 고르기 화면: 최근 연 폴더 목록 제목"
other = "최근 폴더"

[recent_none]
desc = "폴더 고르기 화면: 최근 연 폴더가 없을 때"
other = "아직 연 폴더가 없어요"

[recovery_available]
desc = "대화상자 제목: 지난번에 저장하지 못한 편집이 복구 일지에 남아 있음"
other = "복구할 내용이 있어요"

[recovery_body]
desc = "복구 대화상자 본문: 무엇이 남아 있는지. n = 파일 수"
params = { n = "int" }
no_truncate = true
other = "masil 이 끝나기 전에 저장하지 못한 편집이 파일 {n}개에 남아 있어요. 복구하면 그 내용이 편집으로 들어가고, 저장해야 디스크에 써져요."

[recovery_discard]
desc = "복구 대화상자 단추: 남은 내용을 버림"
other = "버리기"

[recovery_restore]
desc = "복구 대화상자 단추: 남은 내용을 편집으로 되살림"
other = "복구"

[save_failed]
desc = "토스트: 파일을 저장하지 못했을 때"
other = "저장하지 못했어요"

[saved]
desc = "토스트: 파일을 저장했을 때. file = 파일 이름(번역하지 않음)"
params = { file = "string" }
other = "{file} 저장했어요"

[subtab_code]
desc = "위젯 하위 탭: 코드 칸"
max = 4
other = "코드"

[subtab_people]
desc = "위젯 하위 탭: 사람 목록. n = 들어온 사람 수"
params = { n = "int" }
max = 9
other = "사람({n})"

[subtab_term]
desc = "위젯 하위 탭: 터미널 칸"
max = 6
other = "터미널"

[subtab_tree]
desc = "위젯 하위 탭: 파일 트리 칸"
max = 4
other = "트리"

[term_empty_hint]
desc = "터미널 칸: 아직 터미널이 없을 때(n 키로 새 터미널)"
other = "n 새 터미널"

[term_title_unsaved]
desc = "터미널 칸 제목 끝: 저장 안 된 문서 수(프로그램은 디스크만 읽음). n = 문서 수"
params = { n = "int" }
other = "저장 안 됨 {n}"

[tree_more_entries]
desc = "트리: 한 폴더에서 5,000개 넘게 있어 줄인 나머지 수. n = 나머지 수"
params = { n = "int" }
other = "…외 {n}개"

[tree_secret_hidden]
desc = "트리: 차단 목록에 걸린 비밀 파일(참가자에게 안 보임). name = 파일 이름(번역하지 않음)"
params = { name = "string" }
other = "🔒 {name} (공유 안 됨)"

[windows_no_terminal]
desc = "터미널 칸 안내: Windows 에서는 내장 터미널이 아직 안 됨. key = 전체 화면 실행 키(번역하지 않음)"
params = { key = "string" }
no_truncate = true
other = "Windows에서는 masil 안 터미널이 아직 안 돼요. {key}로 전체 화면 실행"
