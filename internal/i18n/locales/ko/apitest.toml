# API test tool area (v0.1.3 spec C3): the api tool's screens, prompts, cards
# and the table and JSON tree widgets. Not translated: HTTP methods, status
# texts (Created), header names, key names and user labels.

[big_body]
desc = "응답 본문이 10MB 를 넘어 앞부분만 보일 때의 안내 줄"
other = "앞 10MB 만 보여요 · 파일로 저장"

[binary_body]
desc = "응답이 이미지·바이너리라 글자로 그리지 않을 때(type = Content-Type, size = 사람이 읽는 크기)"
params = { type = "string", size = "string" }
other = "바이너리 · {type} · {size} — 파일로 저장"

[body_overwritten]
desc = "공유 컬렉션에서 동료가 같은 요청 본문을 덮어써 내 편집이 졌을 때(name = 동료 표시 이름)"
params = { name = "string" }
other = "{name}님이 본문을 바꿨어요 · 내 내용 복구"

[card_result_body]
desc = "api.result 카드의 0.1.2 클라이언트용 대체 본문(번역 거의 없음 — 메서드·경로·상태는 그대로)"
params = { method = "string", path = "string", status = "int", ms = "int", ok = "int", total = "int" }
other = "🧪 {method} {path} · {status} · {ms}ms · ✓{ok}/{total}"

[card_run_body]
desc = "api.run 카드의 0.1.2 클라이언트용 대체 본문(name = 컬렉션 이름, n = 요청 수)"
params = { name = "string", n = "int", ok = "int", fail = "int", ms = "int" }
other = "🧪 {name} 실행 · {n}개 · ✓{ok} ✕{fail} · {ms}ms"

[file_changed]
desc = "열어 둔 개인 컬렉션 파일을 masil 밖에서 고쳤을 때의 안내 줄"
other = "파일이 바뀌었어요 · 다시 읽기"

[help_terms]
desc = "도움말의 약관 책임 한 줄(요청은 사용자 PC 에서 나감, 줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "요청은 내 PC·내 IP 에서 나가요. 대상 서비스 약관을 지킬 책임은 나에게 있어요"

[host_block]
desc = "비밀 변수를 허용 목록 밖 호스트로 보내려 할 때 보내기 전에 묻는 문장(var = 변수 이름, 앞뒤 {{ }} 가 붙음; host = 호스트 이름; 줄여 쓰지 않음)"
params = { var = "string", host = "string" }
no_truncate = true
legal = true
other = "{{{var}}} 을 {host} 로 보내려 해요 · 이 호스트 허용 / 취소"

[kv_empty]
desc = "헤더·쿼리·form·검사·환경 표가 비었을 때 표 안의 한 줄"
max = 30
other = "줄이 없어요 · a 로 추가"

[last_changed]
desc = "공유 요청 줄 옆: 마지막으로 바꾼 사람과 지난 시간(ago = '2분 전' 같은 사람이 읽는 시간)"
params = { name = "string", ago = "string" }
other = "마지막 변경: {name} · {ago}"

[need_bigger]
desc = "창이 너무 작아 이 화면을 그릴 수 없을 때"
max = 24
other = "창을 키워 주세요"

[no_value]
desc = "환경 화면: 비밀 변수에 내 값이 아직 없을 때 값 칸"
other = "값 없음(내 값 넣기)"

[openapi_yaml_unsupported]
desc = "OpenAPI 가져오기에서 YAML 파일을 받았을 때(JSON 만 읽음)"
other = "OpenAPI YAML 은 아직 못 읽어요 · JSON 으로 바꿔 가져와 주세요"

[private_target]
desc = "남이 마지막으로 바꾼 요청이 내 PC·사내망 주소로 갈 때 처음 보내기 전에 묻는 문장(name = 마지막으로 바꾼 사람, 줄여 쓰지 않음)"
params = { name = "string" }
no_truncate = true
legal = true
other = "이 요청은 내 PC 또는 내 네트워크 안 주소로 가요 ({name}님이 마지막으로 바꿈)"

[run_progress_short]
desc = "초소형 화면의 실행기 진행 한 줄(i = 지금 몇 번째, n = 전체, ok = 통과, fail = 실패)"
params = { i = "int", n = "int", ok = "int", fail = "int" }
max = 24
other = "실행 {i}/{n} ✓{ok} ✕{fail}"

[scripts_dropped]
desc = "Postman 가져오기: 버린 스크립트(사전 요청·테스트) 수"
params = { n = "int" }
count = "n"
other = "스크립트 {n}개는 가져오지 않았어요"

[secret_detected]
desc = "공유로 올라갈 칸에서 비밀값처럼 보이는 글자를 찾았을 때의 안내(줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "비밀값처럼 보여요 → 변수로 바꾸기"

[status_line]
desc = "응답 상태 줄(status = 코드, text = 상태 문구 그대로, phases = 단계별 시간, size = 크기, mark = ✓/✕). short = 좁은 화면"
params = { status = "int", text = "string", ms = "int", phases = "string", size = "string", ok = "int", total = "int", mark = "string" }
max = 60
other = "{status} {text} · {ms}ms ({phases}) · {size} · 검사 {ok}/{total} {mark}"
short = "{status} · {ms}ms · ✓{ok}/{total}"

[tls_off_warning]
desc = "TLS 인증서 검사를 끈 요청의 요청 줄 경고(늘 보임, 줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "⚠ 인증서 검사 끔"

[tree_count]
desc = "JSON 나무에서 접힌 객체·배열 옆의 자식 수"
params = { n = "int" }
count = "n"
max = 12
other = "{n}개"

[upload_plaintext_note]
desc = "'방에 올리기' 확인 창의 개인정보 안내(공유 정의는 서버에 평문, 줄여 쓰지 않음)"
no_truncate = true
legal = true
other = "공유 컬렉션의 정의(URL·헤더 이름·비밀이 아닌 값·본문 예시)는 masil 서버에 평문으로 저장되고 방 멤버와 운영자가 볼 수 있어요"
