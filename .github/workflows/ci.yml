name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -short ./...
      - name: build
        # Switch to ./cmd/masil once the entry point exists.
        run: go build ./...
        env:
          CGO_ENABLED: '0'
