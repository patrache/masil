# Server (Cloudflare Workers) CI: type-check and vitest for server/ only.
# Go tests live in ci.yml (owned by client core). This workflow never deploys
# and never touches remote Cloudflare resources.
name: server-ci

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: test
        run: npm test
